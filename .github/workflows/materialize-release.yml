name: Materialize validated v0.3 release

on:
  push:
    branches: [main]
    paths:
      - scripts/.materialize/ready

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Materialize validated source package
        run: node scripts/.materialize/materialize.mjs
      - name: Re-run release validation
        run: npm run validate
      - name: Commit validated application release
        run: |
          rm -rf scripts/.materialize
          rm -f .github/workflows/pages.yml .github/workflows/quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: deliver evidence-first ForkWise reviewer v0.3"
          git push origin HEAD:main
