name: Apply credential scan calibration fix

on:
  push:
    branches:
      - fix/credential-scan-calibration
    paths:
      - .github/workflows/apply-credential-scan-fix.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out calibration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/credential-scan-calibration

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Patch analyzer to classify credential candidates
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          analyzer = Path("src/analyzer.js")
          text = analyzer.read_text(encoding="utf-8")

          inventory_import = 'import { buildArtifactInventory, countExtensions, inventorySummary } from "./inventory.js";\n'
          scanner_import = 'import { scanCredentialCandidates } from "./secret-scanner.js";\n'
          if scanner_import not in text:
              if inventory_import not in text:
                  raise SystemExit("Analyzer import anchor was not found")
              text = text.replace(inventory_import, inventory_import + scanner_import, 1)

          old_patterns = '''const SECRET_SCAN_PATTERNS = [
            /\\bgh[pousr]_[A-Za-z0-9]{20,255}\\b/,
            /\\bgithub_pat_[A-Za-z0-9_]{20,255}\\b/,
            /\\bsk-(?:proj-)?[A-Za-z0-9_-]{16,255}\\b/,
            /\\bAKIA[0-9A-Z]{16}\\b/,
            /\\bxox[baprs]-[A-Za-z0-9-]{10,255}\\b/,
            /(?:api[_-]?key|access[_-]?token|auth[_-]?token|client[_-]?secret|password)\\s*[:=]\\s*["']?[^\\s"'`]{8,}/i,
          ];

          '''
          if old_patterns in text:
              text = text.replace(old_patterns, "", 1)
          elif "const SECRET_SCAN_PATTERNS" in text:
              raise SystemExit("Secret-pattern block changed unexpectedly")

          old_block = '''  const secretMatches = [];
            for (const item of corpus) {
              for (const pattern of SECRET_SCAN_PATTERNS) {
                const match = item.content.match(pattern);
                if (!match) continue;
                secretMatches.push({ item, match: match[0] });
                break;
              }
            }
            if (secretMatches.length) {
              const evidenceIds = secretMatches.slice(0, 5).map(({ item, match }) => fileEvidence(
                item.path,
                "Potential secret pattern",
                "A high-risk credential-like pattern was found; the value is intentionally redacted.",
                redactSensitiveText(match),
              ));
              addFinding({
                ruleId: "potential-secret",
                dimension: "Trust",
                type: "risk",
                severity: "critical",
                title: "Potential credential material was detected",
                summary: `${secretMatches.length} inspected file${secretMatches.length === 1 ? "" : "s"} contained a high-risk credential-like pattern. Values are redacted.`,
                impact: "Exposed credentials can enable unauthorized access even after the file is removed because Git history may retain them.",
                recommendation: "Treat the credential as compromised, rotate/revoke it, inspect history, and verify downstream access logs.",
                evidenceIds,
                blocking: true,
              });
            }
          '''

          new_block = '''  const credentialCandidates = scanCredentialCandidates(corpus);
            if (credentialCandidates.exposed.length) {
              const evidenceIds = credentialCandidates.exposed.slice(0, 5).map((candidate) => fileEvidence(
                candidate.path,
                `Potential ${candidate.kind.toLowerCase()}`,
                "A high-confidence credential-like literal was found; the value is intentionally redacted.",
                redactSensitiveText(candidate.match),
              ));
              addFinding({
                ruleId: "potential-secret",
                dimension: "Trust",
                type: "risk",
                severity: "critical",
                title: "Potential credential material was detected",
                summary: `${credentialCandidates.exposed.length} high-confidence credential-like literal${credentialCandidates.exposed.length === 1 ? " was" : "s were"} found. Environment references, placeholders, documentation examples, and explicit CI/local-only defaults are excluded. Values are redacted.`,
                impact: "Exposed credentials can enable unauthorized access even after the file is removed because Git history may retain them.",
                recommendation: "Treat the credential as compromised, rotate/revoke it, inspect history, and verify downstream access logs.",
                evidenceIds,
                blocking: true,
              });
            }

            const literalDefaults = credentialCandidates.defaults.filter((candidate) =>
              ["development-default", "literal-default"].includes(candidate.disposition),
            );
            if (literalDefaults.length) {
              const evidenceIds = literalDefaults.slice(0, 5).map((candidate) => fileEvidence(
                candidate.path,
                "Literal development credential",
                "A non-secret literal credential default was observed. It is not treated as exposed credential material, but deployments should override it outside bounded development environments.",
                redactSensitiveText(candidate.match),
              ));
              addFinding({
                ruleId: "literal-development-credential",
                dimension: "Trust",
                type: "unknown",
                severity: "low",
                title: "Literal development credential defaults need deployment review",
                summary: `${literalDefaults.length} test, local, or low-entropy credential default${literalDefaults.length === 1 ? " was" : "s were"} observed.`,
                impact: "A documented local default is not evidence of a leaked secret, but reusing it in a reachable deployment can weaken access control.",
                recommendation: "Keep defaults limited to disposable local/test environments and require injected credentials for shared or production deployments.",
                evidenceIds,
                blocking: false,
              });
            }
          '''

          if old_block in text:
              text = text.replace(old_block, new_block, 1)
          elif "const credentialCandidates = scanCredentialCandidates(corpus);" not in text:
              raise SystemExit("Analyzer credential block anchor was not found")

          analyzer.write_text(text, encoding="utf-8")

          schema = Path("src/schema.js")
          schema_text = schema.read_text(encoding="utf-8")
          if 'ANALYZER_VERSION = "0.3.0"' in schema_text:
              schema_text = schema_text.replace('ANALYZER_VERSION = "0.3.0"', 'ANALYZER_VERSION = "0.3.1"', 1)
          elif 'ANALYZER_VERSION = "0.3.1"' not in schema_text:
              raise SystemExit("Analyzer version anchor was not found")
          schema.write_text(schema_text, encoding="utf-8")

          rules = Path("docs/ANALYZER_RULES.md")
          rules_text = rules.read_text(encoding="utf-8")
          section = '''

          ## Credential candidate classification

          The critical `potential-secret` rule is reserved for high-confidence structured tokens, high-entropy credential literals, and literal production/deployment credentials. Environment references, secret-store expressions, explicit placeholders, CI-only values, and local-only examples are not evidence of an exposed external credential. Ambiguous literal defaults can be surfaced separately for deployment review. See [`SECRET_SCAN_CALIBRATION.md`](SECRET_SCAN_CALIBRATION.md).
          '''.replace("          ", "")
          if "## Credential candidate classification" not in rules_text:
              rules.write_text(rules_text.rstrip() + section + "\n", encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          changelog_text = changelog.read_text(encoding="utf-8")
          marker = "## Unreleased\n\nNo unreleased changes recorded."
          replacement = "## Unreleased\n\n### Fixed\n\n- Calibrated credential scanning so environment references, README placeholders, CI test passwords, and explicit local-only defaults no longer create critical exposed-secret findings. High-confidence literal tokens remain critical, blocking, and redacted.\n- Added an owner-wide public repository calibration gate with a ForkWise self-review regression check."
          if marker in changelog_text:
              changelog_text = changelog_text.replace(marker, replacement, 1)
              changelog.write_text(changelog_text, encoding="utf-8")
          PY

          rm .github/workflows/apply-credential-scan-fix.yml

      - name: Validate deterministic application and regression tests
        run: npm run validate

      - name: Run owner-wide calibration before committing the fix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORKWISE_CALIBRATION_OWNER: yashumani
          FORKWISE_CALIBRATION_DIR: validation/owner-repository-calibration
        run: npm run calibrate:owner

      - name: Commit validated patch to the feature branch
        shell: bash
        run: |
          rm -rf validation/owner-repository-calibration
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/analyzer.js src/schema.js src/secret-scanner.js tests/secret-scanner.test.js tests/secret-calibration-integration.test.js docs/SECRET_SCAN_CALIBRATION.md docs/ANALYZER_RULES.md CHANGELOG.md .github/workflows/apply-credential-scan-fix.yml
          git commit -s -m "fix: distinguish credential references from exposed secrets"
          git push origin HEAD:fix/credential-scan-calibration
