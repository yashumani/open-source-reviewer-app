services:
  runner:
    build:
      context: .
    image: forkwise-runner:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      FORKWISE_DATA_DIR: /data
      FORKWISE_ALLOWED_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
    volumes:
      - forkwise-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0

volumes:
  forkwise-data:
